name: CI

on:
  # pushes to main and pull requests; a pushed branch with a pull request
  # would otherwise run it twice
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"
      - run: make lint

  test:
    # The suite with the `library` extra (the dev environment).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: tesseract, which every ingest runs
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y tesseract-ocr
          else
            brew install tesseract
          fi
      - run: make test
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.14') }}
      # One cell measures coverage, as a report in the run's summary: no
      # threshold fails a change.
      - name: make coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.14' }}
        run: |
          make coverage
          echo "Line coverage: $(uv run coverage report --format=total)%" >> "$GITHUB_STEP_SUMMARY"

  test-core:
    # The package alone. Python 3.15 runs only this until onnxruntime,
    # which the `library` extra needs, ships wheels for it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: tesseract, which every ingest runs
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y tesseract-ocr
          else
            brew install tesseract
          fi
      - run: make test-core
